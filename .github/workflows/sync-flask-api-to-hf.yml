name: Sync Flask API to Hugging Face Space

on:
  push:
    branches:
      - main
    paths:
      - "flask_api/**"
      - ".github/workflows/sync-flask-api-to-hf.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-flask-api-to-hf
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Flask API LFS assets
        run: |
          git lfs install
          git lfs pull --include="flask_api/data/**"

      - name: Sync and push Flask API to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: Peenjeee
          HF_SPACE: bogor-xplore-api
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Missing HF_TOKEN secret. Add it in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          retry() {
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi

              if [ "$attempt" -eq 5 ]; then
                echo "Command failed after $attempt attempts."
                return 1
              fi

              sleep_seconds=$((attempt * 60))
              echo "Command failed, retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
            done
          }

          export GIT_LFS_SKIP_SMUDGE=1
          retry git clone --depth 1 --branch main "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}" /tmp/hf-space
          unset GIT_LFS_SKIP_SMUDGE

          rsync -a --delete --exclude='.git' flask_api/ /tmp/hf-space/

          cd /tmp/hf-space
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install
          git add -A

          if git diff --cached --quiet; then
            echo "No Flask API changes to sync."
            exit 0
          fi

          git commit -m "Sync Flask API from GitHub ${GITHUB_SHA}"

          retry git push origin main

